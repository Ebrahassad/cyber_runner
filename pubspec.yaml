name: cyber_runner
description: Ultimate Professional Cyberpunk Endless Runner Game
version: 3.0.0+5

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.8.0
  flame_audio: ^2.1.0
  shared_preferences: ^2.0.15
  unity_ads_plugin: ^0.5.0
  vibration: ^3.2.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/music/
    - assets/audio/sfx/
