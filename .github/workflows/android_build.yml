name: Build Cyber Runner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify or Generate Android Platform Files
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory missing. Recreating platform files..."
            flutter create . --platforms=android --org com.cyber.runner
          else
            echo "Android directory found."
          fi

      - name: Clean Project Cache
        run: flutter clean

      - name: Get Dependencies & Packages
        run: flutter pub get

      - name: Build APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-runner-apks
          path: build/app/outputs/flutter-apk/*.apk
