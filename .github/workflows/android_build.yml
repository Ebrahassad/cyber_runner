name: Build Cyber Runner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Directory
        run: |
          flutter create . --platforms=android --org com.cyber.runner

      - name: Clean & Remove Old Lockfile
        run: |
          rm -f pubspec.lock

      - name: Get Dependencies & Packages
        run: flutter pub get

      - name: Build APK (Split per ABI)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-runner-apks
          path: build/app/outputs/flutter-apk/*.apk
