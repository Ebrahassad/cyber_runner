name: cyber_runner
description: A complete 3D-styled endless runner game.
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.0.15
  audioplayers: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/character/
    - assets/images/environment/
    - assets/images/obstacles/
    - assets/audio/music/
    - assets/audio/sfx/
